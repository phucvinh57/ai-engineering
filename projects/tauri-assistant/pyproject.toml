[project]
name = "tauri-assistant"
version = "0.1.0"
description = "RAG chatbot over Tauri app framework documentation"
readme = "README.md"
authors = [
    { name = "Nguyen Phuc Vinh", email = "npvinh0507@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "openai>=3.13.0",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "tiktoken>=0.14.0",
    "sentence-transformers>=6.0.1",
    "transformers>=5.0.0",
    "huggingface-hub>=0.30.0",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "gitpython>=3.1.62",
    "langchain-core>=1.6.3",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langfuse>=4.15.3",
    "loguru>=0.7.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-typescript>=0.23.2",
    "peewee>=4.5.1",
]

[project.scripts]
tauri-assistant = "tauri_assistant:main"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
