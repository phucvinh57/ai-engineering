[project]
name = "tauri-assistant"
version = "0.1.0"
description = "RAG chatbot over Tauri app framework documentation"
readme = "README.md"
authors = [
    { name = "Nguyen Phuc Vinh", email = "npvinh0507@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.54",
    "chromadb>=0.5.20",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "markdownify>=0.13",
    "tiktoken>=0.8",
    "sentence-transformers>=3.2",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "typer>=0.13",
    "gitpython>=3.1",
    "langchain-core>=1.6.3",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
]

[project.scripts]
tauri-assistant = "tauri_assistant.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
