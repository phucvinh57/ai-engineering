[project]
name = "ai-learning"
version = "0.1.0"
description = "AI learning monorepo"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["projects/*"]

[dependency-groups]
dev = ["ruff>=0.7"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern relies on calling Depends(...)/Query(...)/etc. in
# argument defaults; ruff's B008 otherwise flags every route handler.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
